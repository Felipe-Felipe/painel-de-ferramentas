<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel de Ferramentas</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="caixa1">Painel de Ferramentas</header>

    <main class="conteudo-principal">
      <aside class="menu-lateral">
        <nav>
          <ul>
            <li onclick="trocarTela(1)" class="desafio">Moedas</li>
            <li onclick="trocarTela(2)" class="desafio">IMC</li>
            <li onclick="trocarTela(3)" class="desafio">Temperatura</li>
            <li onclick="trocarTela(4)" class="desafio">Velocidade</li>
            <li onclick="trocarTela(5)" class="desafio">Massa</li>
            <li onclick="trocarTela(6)" class="desafio">Regra de 3</li>
          </ul>
        </nav>
      </aside>

      <section class="texto-principal">
        <section class="teladesafio moedas">
          <div class="container">
            <div class="conversor">
              <h1>Conversor USD para BRL</h1>
              <p id="cotacao">Carregando cotação...</p>
              <input type="number" id="valor" placeholder="Digite um valor" />
              <div class="botoes">
                <button onclick="usdParaBrl()">USD => BRL</button>
                <button onclick="brlParaUsd()">BRL => USD</button>
              </div>
              <h2 id="resultado"></h2>
              <p id="erro"></p>
            </div>
          </div>
        </section>
        <section class="teladesafio imc">
          <div class="containerimc">
            <h1>Calculadora de IMC</h1>

            <input type="number" id="peso" placeholder="Peso (kg)" />

            <input
              type="number"
              id="altura"
              step="0.01"
              placeholder="Altura (m)"
            />

            <label for="genero"></label>
            <select id="genero">
              <option value="homem">Homem</option>
              <option value="mulher">Mulher</option>
            </select>

            <button id="btnCalcular">Calcular</button>

            <div id="resultadoimc"></div>
          </div>
        </section>
        <section class="teladesafio temperatura">
          <div class="containertemperatura">
            <h1>Conversor de Temperatura</h1>
            <input
              type="number"
              id="valorTemperatura"
              placeholder="Digite um valor"
            />

            <label for="unidadeOrigem"></label>
            <select id="unidadeOrigem" aria-label="Unidade de origem">
              <option value="celsius">Celsius (°C)</option>
              <option value="fahrenheit">Fahrenheit (°F)</option>
            </select>

            <label for="unidadeDestino"></label>
            <select id="unidadeDestino" aria-label="Unidade de destino">
              <option value="fahrenheit">Fahrenheit (°F)</option>
              <option value="celsius">Celsius (°C)</option>
            </select>

            <button id="btnConverter">Converter</button>
            

            <div id="resultadotemperatura"></div>
        </section>
       <section class="teladesafio velocidade telaselecionada">
    <div class="containervelocidade">
        <h1>Conversor de Velocidade</h1>

        <input
            type="number"
            id="valorVelocidade"
            placeholder="Digite um valor"
        />

        <label for="unidadeVelocidade"></label>
        <select id="unidadeVelocidade">
            <option value="kmh">Km/h</option>
            <option value="mph">mph</option>
        </select>

        <label for="unidadeVelocidadeDestino"></label>
        <select id="unidadeVelocidadeDestino">
            <option value="mph">mph</option>
            <option value="kmh">Km/h</option>
        </select>

        <button id="btnConverterVelocidade">
            Converter
        </button>

        <div id="resultadovelocidade"></div>
    </div>
</section>
        <section class="teladesafio massa">
          <h1>Massa</h1>
        </section>
        <section class="teladesafio regra">
          <h1>Regra de 3</h1>
        </section>
      </section>
    </main>

    <footer class="rodape">Footer</footer>
  </body>
</html>
