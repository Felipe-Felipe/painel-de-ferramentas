<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel de Ferramentas</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="caixa1">Painel de Ferramentas</header>

    <main class="conteudo-principal">
      <aside class="menu-lateral">
        <nav>
          <ul>
            <li onclick="trocarTela(1)" class="desafio">
               Moedas
            </li>
            <li onclick="trocarTela(2)" class="desafio">
               IMC
            </li>
            <li onclick="trocarTela(3)" class="desafio">
               Temperatura
            </li>
            <li onclick="trocarTela(4)" class="desafio">
               Velocidade
            </li>
            <li onclick="trocarTela(5)" class="desafio">
               Massa
            </li>
            <li onclick="trocarTela(6)" class="desafio">
               Regra de 3
            </li>
          </ul>
        </nav>
      </aside>

      <section class="texto-principal">
        <section class="teladesafio moedas telaselecionada">
            <div class="container">
              <div class="conversor">
                <h1>Conversor USD para BRL</h1>
                <p id="cotacao">Carregando cotação...</p>
                <input type="number" id="valor" placeholder="Digite um valor">
                <div class="botoes">
                    <button onclick="usdParaBrl()">USD => BRL</button>
                    <button onclick="brlParaUsd()">BRL => USD</button>
                </div>
                <h2 id="resultado"></h2>
                <p id="erro"></p>
              </div>
          </div>
        </section>
        <section class="teladesafio imc">
            <h1>IMC</h1>
        </section>
        <section class="teladesafio temperatura">
            <h1>Temperatura</h1>
        </section>
        <section class="teladesafio velocidade">
            <h1>Velocidade</h1>
        </section>
        <section class="teladesafio massa">
            <h1>Massa</h1>
        </section>
        <section class="teladesafio regra">
            <h1>Regra de 3</h1>
        </section>
      </section>
    </main>

    <footer class="rodape">Footer</footer>
  </body>
</html>
